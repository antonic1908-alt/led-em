; Уроки 01–08 для ESP32-C3 Super Mini. Кожен урок — окремий env.
;   pio run -e l01_blink -t upload && pio device monitor
; Піни ті самі, що й у фінальному проєкті (див. ../firmware/src/config.h),
; тож схему на макетці можна збирати поступово й не переробляти.
; Рядки, що починаються з «;», — коментарі.
;
; ============================================================================
; ДОВІДКА: що таке PlatformIO?
; ============================================================================
; PlatformIO — це НЕ мова, НЕ компілятор і НЕ фреймворк. Це інструмент, який керує проєктом:
; завантажує потрібний компілятор і бібліотеки, збирає прошивку, прошиває плату
; і показує лог (Serial Monitor). Складається з двох частин:
;   PlatformIO Core — програма командного рядка `pio` (написана на Python). Саме її запускає ШІ-агент.
;   PlatformIO IDE  — розширення VS Code: кнопки ✓ (збірка), → (прошивка), 🔌 (монітор) над тим самим `pio`.
;
; Аналогія зі світу C#/.NET/Unity:
;   .csproj (що і як збирати)              ->  platformio.ini (цей файл)
;   NuGet-пакети в .csproj                 ->  lib_deps = olikraus/U8g2@^2.35.9 (реєстр PlatformIO)
;   dotnet build / dotnet run              ->  pio run / pio run -t upload
;   Конфігурації Debug / Release           ->  env-и: [env:l01_blink], [env:l02_button] ...
;   Build Settings → платформа (Android…)  ->  platform = ... і board = ...
;   Unity Hub завантажує потрібну версію   ->  PlatformIO сам завантажує компілятор, ядро Arduino,
;     редактора й модулі платформ               esptool тощо в %USERPROFILE%\.platformio
;   папки bin/ і obj/                      ->  папка .pio/ (результати збірки; можна видаляти)
;   вікно Console у Unity                  ->  pio device monitor (Serial Monitor)
;
; Хто за що відповідає (від верхнього шару до нижнього):
;   Ваш код     — src/01_blink/main.cpp ............. рядок build_src_filter
;   Бібліотеки  — U8g2, BH1750, VL53L0X ............. рядок lib_deps
;   Фреймворк   — Arduino (або ESP-IDF, STM32Cube) .. рядок framework
;   Платформа   — компілятор GCC + утиліти прошивки . рядок platform
;   Плата       — ESP32-C3 Super Mini ............... рядок board
; PlatformIO лише читає цей файл і склеює всі шари в одну прошивку.
;
; Що відбувається при `pio run -e l01_blink`:
;   1. читає platformio.ini і бере секцію [env:l01_blink] + спільну [env];
;   2. якщо платформи/компілятора ще немає — завантажує їх (перший раз довго, далі з кешу);
;   3. завантажує бібліотеки з lib_deps у .pio/libdeps/<env>/;
;   4. компілює ваш код, ядро Arduino і бібліотеки компілятором GCC (riscv32-esp-elf-g++ для ESP32-C3);
;   5. лінкує все в .pio/build/<env>/firmware.elf і firmware.bin;
;   6. з -t upload — прошиває плату (ESP32: esptool; STM32: dfu-util або ST-Link).
;
; Основні команди:
;   pio run -e l01_blink               зібрати урок
;   pio run -e l01_blink -t upload     зібрати й прошити
;   pio device monitor -b 115200       відкрити лог (вихід — Ctrl+C)
;   pio device list                    показати підключені COM-порти
;   pio run -e l01_blink -t clean      видалити результати збірки цього env
;   pio pkg update                     оновити платформи й бібліотеки
;
; Порівняння з іншими інструментами:
;   Arduino IDE 2  — найпростіший старт. Але плата обирається в меню IDE, а бібліотеки спільні для
;                    всіх скетчів, тож версії не зафіксовані в проєкті. Є консольна arduino-cli.
;   ESP-IDF        — офіційний інструмент Espressif (idf.py + CMake). Лише чипи ESP32, максимум можливостей.
;   STM32CubeIDE   — офіційна IDE від ST (Eclipse + CubeMX + HAL + налагоджувач). Лише STM32.
;   PlatformIO     — один інструмент для ESP32 і STM32 (і сотень інших плат), налаштування і версії
;                    записані в platformio.ini, усе запускається з командного рядка — зручно для ШІ-агента.
; PlatformIO вміє використовувати і «рідні» фреймворки: framework = espidf або framework = stm32cube.
; ============================================================================

; Загальні налаштування проєкту
[platformio]
; який урок збирати командою `pio run` без -e
default_envs = l01_blink

; ---------- Спільне для всіх уроків ----------
; Секція [env] без імені — «базовий клас»: кожен [env:...] нижче успадковує ці значення.
[env]
; платформа = компілятор + ядро Arduino для чипів Espressif (офіційна збірка PlatformIO)
platform = platformio/espressif32
; опис плати: ESP32-C3 з 4 МБ flash (Super Mini сумісна з цим описом)
board = esp32-c3-devkitm-1
; режим доступу до flash: DIO надійно працює на платах Super Mini
board_build.flash_mode = dio
; фреймворк Arduino: setup/loop, digitalWrite, Serial...
framework = arduino
; швидкість Serial Monitor (як у Serial.begin(115200))
monitor_speed = 115200
build_flags =
    ; USB чипа працює в режимі USB-Serial/JTAG (окремого чипа USB-UART на платі немає)
    -DARDUINO_USB_MODE=1
    ; Serial = USB-порт одразу після старту, інакше лог не буде видно
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------- Уроки ----------
; build_src_filter — які файли з src/ компілювати: +<папка/> = лише цю папку.
; Так кожен урок має свою функцію setup()/loop() і вони не конфліктують між собою.

; Урок 01: мигання LED без delay()
[env:l01_blink]
build_src_filter = +<01_blink/>

; Урок 02: кнопка, антибрязкіт, коротке/довге натискання
[env:l02_button]
build_src_filter = +<02_button/>

; Урок 03: ШІМ і MOSFET — «дихання» стрічки
[env:l03_pwm_mosfet]
build_src_filter = +<03_pwm_mosfet/>

; Урок 04: АЦП і фоторезистор
[env:l04_adc_ldr]
build_src_filter = +<04_adc_ldr/>

; Урок 05: датчик руху HC-SR501
[env:l05_pir]
build_src_filter = +<05_pir/>

; Урок 06: сканер I2C і датчик світла BH1750
[env:l06_i2c_bh1750]
build_src_filter = +<06_i2c_scan_bh1750/>
; бібліотека BH1750 потрібна лише цьому уроку
lib_deps = claws/BH1750@^1.3.0

; Урок 07: дисплей OLED SSD1306
[env:l07_oled]
build_src_filter = +<07_oled/>
; графічна бібліотека U8g2
lib_deps = olikraus/U8g2@^2.35.9

; Урок 08: датчик дистанції VL53L0X / HC-SR04
[env:l08_distance]
build_src_filter = +<08_distance/>
; бібліотека VL53L0X
lib_deps = pololu/VL53L0X@^1.3.1
