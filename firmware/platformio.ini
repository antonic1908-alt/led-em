; Розумна LED-стрічка — основна прошивка.
; platformio.ini — «файл проєкту» PlatformIO (як .csproj у C#): для якої плати збирати,
; які бібліотеки завантажити і з якими прапорами компілювати.
; Рядки, що починаються з «;», — коментарі.
; Докладно про те, що таке PlatformIO, — див. довідку на початку ../lessons/platformio.ini.
;
; Env-и (environment = «варіант збірки», як конфігурації Debug/Release у Visual Studio):
;   esp32c3      — реальна ESP32-C3 Super Mini (BH1750 + VL53L0X)
;   esp32c3_sim  — для симулятора Wokwi (фоторезисторний модуль + HC-SR04)
;   blackpill    — STM32F411CEU6 Black Pill (STM32duino)

; Загальні налаштування проєкту
[platformio]
; який env збирати командою `pio run` без -e
default_envs = esp32c3

; ---------- Спільне для всіх env-ів ----------
; Секція [env] без імені — «базовий клас»: кожен [env:...] успадковує ці значення.
[env]
; фреймворк Arduino (setup/loop, digitalWrite, Serial...) — однаковий API на ESP32 і STM32
framework = arduino
; швидкість Serial Monitor (має збігатися з Serial.begin(115200) у коді)
monitor_speed = 115200
; бібліотеки, які PlatformIO сам завантажить (як NuGet-пакети); ^ = «ця версія або новіша сумісна»
lib_deps =
    ; графіка для OLED SSD1306
    olikraus/U8g2@^2.35.9
    ; датчик освітленості BH1750
    claws/BH1750@^1.3.0
    ; лазерний датчик дистанції VL53L0X
    pololu/VL53L0X@^1.3.1
; прапори компілятора: -Wall = показувати всі попередження (як warning level 4 у C#)
build_flags = -Wall

; ---------- ESP32-C3 ----------
; Офіційна платформа PlatformIO (перевірено: Arduino-ESP32 3.3.x, без Git).
; Альтернатива — спільнотна pioarduino (новіший Arduino-ESP32, але потребує Git і на Windows
; може впиратися в обмеження довжини шляху та Smart App Control):
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; [esp32c3_base] — не env, а просто набір налаштувань, від якого env-и нижче «наслідуються» через extends.
[esp32c3_base]
; платформа = компілятор + ядро Arduino для чипів Espressif
platform = platformio/espressif32
; опис плати: ESP32-C3 з 4 МБ flash (Super Mini сумісна з цим описом)
board = esp32-c3-devkitm-1
; режим доступу до flash: DIO надійно працює на дешевих платах Super Mini
board_build.flash_mode = dio
build_flags =
    ; взяти спільні прапори з [env] (тобто -Wall)
    ${env.build_flags}
    ; USB чипа працює в режимі USB-Serial/JTAG (окремого чипа USB-UART на платі немає)
    -DARDUINO_USB_MODE=1
    ; Serial = USB-порт одразу після старту — інакше Serial.print нічого не виведе в монітор
    -DARDUINO_USB_CDC_ON_BOOT=1

; Реальна плата
[env:esp32c3]
; взяти все з [esp32c3_base]
extends = esp32c3_base

; Збірка для симулятора Wokwi
[env:esp32c3_sim]
extends = esp32c3_base
build_flags =
    ; усі прапори базової секції
    ${esp32c3_base.build_flags}
    ; SIM_MODE=1 — у config.h вмикає HC-SR04 і фоторезисторний модуль Wokwi
    -DSIM_MODE=1

; ---------- STM32F411 Black Pill ----------
[env:blackpill]
; платформа ST STM32 (компілятор arm-none-eabi + ядро STM32duino)
platform = ststm32
; опис плати Black Pill з STM32F411CE
board = blackpill_f411ce
; dfu — через USB (BOOT0 + NRST); stlink — через програматор ST-Link V2
upload_protocol = dfu
build_flags =
    ; спільні прапори з [env]
    ${env.build_flags}
    ; увімкнути віртуальний COM-порт по USB, щоб Serial працював через USB-кабель
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    ; увімкнути USB-периферію в ядрі STM32duino
    -DUSBCON
    ; newlib-nano за замовчуванням не друкує float у printf — вмикаємо
    -Wl,-u,_printf_float
